<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forsaken Music - Android Mobile Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="/static/logo.png">
  <style>
    body {
      padding-bottom: 150px; /* Space for mini player + nav bar */
      user-select: none;
    }

    .mobile-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 11, 16, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-glass);
    }

    .mobile-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .mobile-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent-gradient);
      display: grid;
      place-items: center;
    }

    .mobile-search-bar {
      margin: 16px 20px;
      position: relative;
    }

    .mobile-search-bar input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .mobile-search-bar input:focus {
      border-color: var(--accent-primary);
      background: rgba(255, 255, 255, 0.1);
    }

    .mobile-search-bar svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Track Cards List */
    .track-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      transition: var(--transition-smooth);
    }

    .track-card.active {
      border-color: var(--accent-primary);
      background: rgba(139, 92, 246, 0.15);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
      flex: 1;
    }

    .track-thumb {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-meta {
      overflow: hidden;
    }

    .track-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-play-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--accent-gradient);
      border: none;
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* Docked Mini Player */
    .mini-player {
      position: fixed;
      bottom: 64px; /* above bottom nav */
      left: 12px;
      right: 12px;
      height: 64px;
      border-radius: var(--radius-md);
      background: rgba(22, 25, 38, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      z-index: 90;
      cursor: pointer;
    }

    .mini-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex: 1;
    }

    .mini-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .mini-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-btn {
      background: transparent;
      border: none;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
    }

    /* Fullscreen Drawer Player */
    .full-player-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0a0b10 100%);
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .full-player-drawer.open {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .vinyl-container {
      margin: auto;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: #000;
      border: 8px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.35);
      position: relative;
      display: grid;
      place-items: center;
    }

    .vinyl-art {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
    }

    .drawer-meta {
      text-align: center;
      margin-bottom: 24px;
    }

    .drawer-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .drawer-artist {
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .drawer-progress-container {
      margin-bottom: 24px;
    }

    .drawer-progress-bar {
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-full);
      overflow: hidden;
      cursor: pointer;
    }

    .drawer-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
    }

    .drawer-time {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .drawer-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      margin-bottom: 20px;
    }

    .drawer-play-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--accent-gradient);
      border: none;
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-glow);
    }

    /* Bottom Nav */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(14, 16, 26, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .bottom-nav-item.active {
      color: var(--accent-primary);
    }

    /* Playlist Pills */
    .playlist-pill-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .playlist-pill-container::-webkit-scrollbar {
      display: none;
    }

    .playlist-pill {
      white-space: nowrap;
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .playlist-pill.active {
      background: var(--accent-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
    }

    .playlist-pill.create-pill {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Modals for Mobile */
    .mobile-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
    }

    .mobile-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-modal-card {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 22px;
      width: 88%;
      max-width: 360px;
    }
  </style>
</head>
<body>

  <!-- Mobile Header -->
  <header class="mobile-header">
    <div class="mobile-brand" style="display:flex; align-items:center;">
      <a href="/mobile" style="display:flex; align-items:center; text-decoration:none;">
        <img src="/static/logo.png" alt="Forsaken Song" style="max-height: 38px; width: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4));">
      </a>
    </div>
  </header>

  <!-- Search -->
  <div class="mobile-search-bar">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" placeholder="Search track or artist..." oninput="handleSearch(this.value)">
  </div>

  <!-- Playlist Pills Filter Bar -->
  <div class="playlist-pill-container" id="mobilePillContainer">
    <button id="pillAllSongs" class="playlist-pill active" onclick="loadAllSongsMobile()">All Tracks</button>
    <button class="playlist-pill create-pill" onclick="openCreatePlaylistMobile()">+ Create</button>
    <div id="mobileCustomPills" style="display:flex; gap:8px;"></div>
  </div>

  <!-- Songs List -->
  <div class="track-list" id="mobileTrackList">
    <!-- Populated via JS -->
  </div>

  <!-- Docked Mini Player -->
  <div class="mini-player" id="miniPlayer" onclick="openDrawer()">
    <div class="mini-left">
      <img id="miniCover" class="mini-thumb" src="/api/cover/0" alt="Cover">
      <div style="overflow:hidden;">
        <div id="miniTitle" style="font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">No song playing</div>
        <div id="miniArtist" style="font-size:0.75rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Tap to select</div>
      </div>
    </div>
    <div class="mini-right" onclick="event.stopPropagation();">
      <button class="mini-btn" onclick="togglePlay()">
        <svg id="miniPlayIcon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="miniPauseIcon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="mini-btn" onclick="playNext()">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Fullscreen Expandable Drawer Player -->
  <div class="full-player-drawer" id="playerDrawer">
    <div class="drawer-header">
      <button class="mini-btn" onclick="closeDrawer()">
        <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </button>
      <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Now Playing</span>
      <div style="width: 28px;"></div>
    </div>

    <div class="vinyl-container">
      <img id="drawerVinyl" class="vinyl-art" src="/api/cover/0" alt="Art">
    </div>

    <div class="drawer-meta">
      <div class="drawer-title" id="drawerTitle">Track Title</div>
      <div class="drawer-artist" id="drawerArtist">Artist Name</div>
    </div>

    <div class="drawer-progress-container">
      <div class="drawer-progress-bar" onclick="seekAudio(event)">
        <div class="drawer-progress-fill" id="drawerProgressFill"></div>
      </div>
      <div class="drawer-time">
        <span id="drawerCurrentTime">0:00</span>
        <span id="drawerTotalDuration">0:00</span>
      </div>
    </div>

    <div class="drawer-controls">
      <button class="mini-btn" onclick="playPrev()">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="drawer-play-btn" onclick="togglePlay()">
        <svg id="drawerPlayIcon" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="drawerPauseIcon" width="30" height="30" fill="currentColor" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="mini-btn" onclick="playNext()">
        <svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="/mobile" class="bottom-nav-item active">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="/desktop" class="bottom-nav-item">
      <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
      Desktop
    </a>
  </nav>

  <audio id="audioElement" preload="metadata"></audio>

  <!-- Mobile Create Playlist Modal -->
  <div id="mobileCreateModal" class="mobile-modal-overlay" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="mobile-modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:1.15rem; font-weight:800; color:#fff;">New Playlist</h3>
        <button onclick="document.getElementById('mobileCreateModal').classList.remove('active')" style="background:transparent; border:none; color:var(--text-muted); font-size:1.4rem;">&times;</button>
      </div>
      <input type="text" id="mobilePlaylistNameInput" placeholder="Playlist name..." style="width:100%; background:rgba(255,255,255,0.06); border:1px solid var(--border-glass); border-radius:10px; padding:12px; color:#fff; font-size:0.95rem; margin-bottom:18px; outline:none;" onkeydown="if(event.key==='Enter') submitCreatePlaylistMobile()">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-secondary" style="padding:8px 14px;" onclick="document.getElementById('mobileCreateModal').classList.remove('active')">Cancel</button>
        <button class="btn btn-primary" style="padding:8px 16px;" onclick="submitCreatePlaylistMobile()">Create</button>
      </div>
    </div>
  </div>

  <!-- Mobile Add To Playlist Modal -->
  <div id="mobileAddToModal" class="mobile-modal-overlay" onclick="if(event.target===this) this.classList.remove('active')">
    <div class="mobile-modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:1.15rem; font-weight:800; color:#fff;">Add to Playlist</h3>
        <button onclick="document.getElementById('mobileAddToModal').classList.remove('active')" style="background:transparent; border:none; color:var(--text-muted); font-size:1.4rem;">&times;</button>
      </div>
      <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:14px;">Song: <span id="mobileModalSongTitle" style="color:#fff; font-weight:700;"></span></div>
      <div id="mobileModalPlaylistList" style="max-height:200px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"></div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn btn-secondary" style="padding:6px 14px;" onclick="document.getElementById('mobileAddToModal').classList.remove('active')">Done</button>
      </div>
    </div>
  </div>

  <script>
    let songs = [];
    let playlists = [];
    let currentPlaylistId = null;
    let currentIndex = -1;
    let activeMobileSongId = null;
    const audio = document.getElementById('audioElement');

    async function fetchPlaylistsMobile() {
      try {
        const res = await fetch('/api/playlists');
        playlists = await res.json();
        renderPlaylistPills();
      } catch (e) {
        console.error(e);
      }
    }

    function renderPlaylistPills() {
      const container = document.getElementById('mobileCustomPills');
      container.innerHTML = playlists.map(p => `
        <button class="playlist-pill ${currentPlaylistId === p.id ? 'active' : ''}" onclick="loadPlaylistMobile(${p.id})">
          ${p.name} (${p.song_count || 0})
        </button>
      `).join('');
    }

    async function loadAllSongsMobile() {
      currentPlaylistId = null;
      document.getElementById('pillAllSongs').classList.add('active');
      renderPlaylistPills();
      await fetchSongs();
    }

    async function loadPlaylistMobile(id) {
      try {
        currentPlaylistId = id;
        document.getElementById('pillAllSongs').classList.remove('active');
        renderPlaylistPills();
        const res = await fetch(`/api/playlists/${id}`);
        const data = await res.json();
        songs = data.songs;
        currentIndex = -1;
        renderSongs();
      } catch(e) {
        console.error(e);
      }
    }

    function openCreatePlaylistMobile() {
      document.getElementById('mobileCreateModal').classList.add('active');
      const input = document.getElementById('mobilePlaylistNameInput');
      input.value = '';
      setTimeout(() => input.focus(), 60);
    }

    async function submitCreatePlaylistMobile() {
      const input = document.getElementById('mobilePlaylistNameInput');
      const name = input.value.trim();
      if (!name) return;
      try {
        const res = await fetch('/api/playlists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        document.getElementById('mobileCreateModal').classList.remove('active');
        await fetchPlaylistsMobile();
        if (data.id) loadPlaylistMobile(data.id);
      } catch(e) {
        alert('Failed to create playlist');
      }
    }

    function openAddToPlaylistMobile(e, songId, title) {
      e.stopPropagation();
      activeMobileSongId = songId;
      document.getElementById('mobileModalSongTitle').innerText = title;
      const listEl = document.getElementById('mobileModalPlaylistList');
      if (!playlists.length) {
        listEl.innerHTML = `<div style="font-size:0.85rem; color:var(--text-muted); padding:10px 0;">No playlists yet. Tap <b>+ Create</b> above to make one!</div>`;
      } else {
        listEl.innerHTML = playlists.map(p => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:rgba(255,255,255,0.04); border-radius:8px;">
            <div style="font-weight:600; font-size:0.85rem; color:#fff;">${p.name}</div>
            <button id="mobAddBtn_${p.id}" class="btn btn-secondary" style="padding:4px 10px; font-size:0.75rem;" onclick="addSongToPlaylistMobile(${p.id}, ${songId})">+ Add</button>
          </div>
        `).join('');
      }
      document.getElementById('mobileAddToModal').classList.add('active');
    }

    async function addSongToPlaylistMobile(playlistId, songId) {
      try {
        const btn = document.getElementById(`mobAddBtn_${playlistId}`);
        if (btn) btn.innerText = 'Adding...';
        await fetch(`/api/playlists/${playlistId}/songs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ song_id: songId })
        });
        if (btn) {
          btn.innerText = 'Added ✓';
          btn.style.color = '#4ade80';
        }
        fetchPlaylistsMobile();
      } catch(e) {
        alert('Error adding song');
      }
    }

    async function removeSongFromCurrentPlaylistMobile(e, songId) {
      e.stopPropagation();
      if (!currentPlaylistId) return;
      try {
        await fetch(`/api/playlists/${currentPlaylistId}/songs/${songId}`, { method: 'DELETE' });
        fetchPlaylistsMobile();
        loadPlaylistMobile(currentPlaylistId);
      } catch(e) {
        alert('Error removing song');
      }
    }

    async function fetchSongs(q = '') {
      try {
        const url = q ? `/api/songs?q=${encodeURIComponent(q)}` : '/api/songs';
        const res = await fetch(url);
        songs = await res.json();
        renderSongs();
      } catch (e) {
        console.error(e);
      }
    }

    function formatTime(s) {
      if (isNaN(s) || s <= 0) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function renderSongs() {
      const container = document.getElementById('mobileTrackList');
      if (!songs.length) {
        const msg = currentPlaylistId 
          ? `No songs in this playlist yet.<br><br><button class="btn btn-secondary" onclick="loadAllSongsMobile()">Go to All Tracks</button>`
          : `No songs in library.<br><br><a href="/admin" class="btn btn-primary">Go to Admin Upload</a>`;
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">${msg}</div>`;
        return;
      }

      container.innerHTML = songs.map((s, idx) => `
        <div class="track-card ${currentIndex === idx ? 'active' : ''}" onclick="playSong(${idx})">
          <div class="track-left">
            <img class="track-thumb" src="/api/cover/${s.id}" alt="Cover">
            <div class="track-meta">
              <div class="track-title">${s.title}</div>
              <div class="track-artist">${s.artist} • ${formatTime(s.duration)}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="track-play-btn" style="background:rgba(255,255,255,0.08); border:none;" onclick="openAddToPlaylistMobile(event, ${s.id}, '${s.title.replace(/'/g, "\\'")}')" title="Add to playlist">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            ${currentPlaylistId ? `
              <button class="track-play-btn" style="background:rgba(239,68,68,0.15); color:#ef4444; border:none;" onclick="removeSongFromCurrentPlaylistMobile(event, ${s.id})" title="Remove from playlist">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            ` : ''}
            <button class="track-play-btn">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function playSong(idx) {
      if (idx < 0 || idx >= songs.length) return;
      currentIndex = idx;
      const s = songs[currentIndex];

      document.getElementById('miniTitle').innerText = s.title;
      document.getElementById('miniArtist').innerText = s.artist;
      document.getElementById('miniCover').src = `/api/cover/${s.id}`;

      document.getElementById('drawerTitle').innerText = s.title;
      document.getElementById('drawerArtist').innerText = s.artist;
      document.getElementById('drawerVinyl').src = `/api/cover/${s.id}`;

      audio.src = `/api/stream/${s.id}`;
      audio.play();
      updatePlayState(true);
      renderSongs();

      // Android Media Session setup (Notification & Lock Screen controls!)
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: s.title,
          artist: s.artist,
          album: s.album || 'Forsaken Music',
          artwork: [{ src: `/api/cover/${s.id}`, sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => { audio.play(); updatePlayState(true); });
        navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); updatePlayState(false); });
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
      }
    }

    function togglePlay() {
      if (!audio.src) {
        if (songs.length) playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        updatePlayState(true);
      } else {
        audio.pause();
        updatePlayState(false);
      }
    }

    function updatePlayState(playing) {
      document.getElementById('miniPlayIcon').style.display = playing ? 'none' : 'block';
      document.getElementById('miniPauseIcon').style.display = playing ? 'block' : 'none';
      document.getElementById('drawerPlayIcon').style.display = playing ? 'none' : 'block';
      document.getElementById('drawerPauseIcon').style.display = playing ? 'block' : 'none';

      const vinyl = document.getElementById('drawerVinyl');
      if (playing) vinyl.classList.add('spinning');
      else vinyl.classList.remove('spinning');
    }

    function playNext() {
      if (!songs.length) return;
      playSong((currentIndex + 1) % songs.length);
    }

    function playPrev() {
      if (!songs.length) return;
      playSong((currentIndex - 1 + songs.length) % songs.length);
    }

    function openDrawer() {
      document.getElementById('playerDrawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('playerDrawer').classList.remove('open');
    }

    function seekAudio(e) {
      const container = e.currentTarget;
      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
      }
    }

    let searchTimer;
    function handleSearch(val) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => fetchSongs(val), 250);
    }

    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const tot = audio.duration || 0;
      document.getElementById('drawerCurrentTime').innerText = formatTime(cur);
      document.getElementById('drawerTotalDuration').innerText = formatTime(tot);
      const pct = tot > 0 ? (cur / tot) * 100 : 0;
      document.getElementById('drawerProgressFill').style.width = `${pct}%`;
    });

    audio.addEventListener('ended', () => playNext());

    fetchPlaylistsMobile();
    fetchSongs();
  </script>
</body>
</html>
