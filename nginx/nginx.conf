events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Allow uploading large audio files (up to 500MB)
    client_max_body_size 500M;

    # Gzip compression for fast web load
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Load Balancer Upstream Cluster (backend1 and backend2)
    upstream backend_cluster {
        least_conn; # Distribute load dynamically based on active connections
        server backend1:8000 max_fails=3 fail_timeout=10s;
        server backend2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Direct High-Performance Streaming for audio from shared volume
        location /music_stream/ {
            alias /music/songs/;
            autoindex off;
            sendfile on;
            sendfile_max_chunk 512k;
            tcp_nopush on;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=86400";
        }

        # Proxy all web and API traffic to load-balanced FastAPI cluster
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket & SSE support if needed
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for downloads & uploads
            proxy_connect_timeout 60s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
