version: "3.9"

services:
  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: music_nginx_lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - music_data:/music:ro
    depends_on:
      - backend1
      - backend2

  # Backend Instance 1 (FastAPI + spotDL worker)
  backend1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: music_backend_1
    restart: unless-stopped
    environment:
      - MUSIC_DATA_DIR=/music
      - WORKER_NAME=Worker-Cluster-Alpha
      - TZ=${TZ:-UTC}
    volumes:
      - music_data:/music

  # Backend Instance 2 (FastAPI + spotDL worker)
  backend2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: music_backend_2
    restart: unless-stopped
    environment:
      - MUSIC_DATA_DIR=/music
      - WORKER_NAME=Worker-Cluster-Beta
      - TZ=${TZ:-UTC}
    volumes:
      - music_data:/music

volumes:
  music_data:
